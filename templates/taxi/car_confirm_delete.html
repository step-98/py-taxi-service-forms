{% extends "base.html" %}

{% block content %}
  <h1>Delete Car</h1>
  <p><i>Do you really want to delete the car: {{ car }}?</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
      <button class="button" onclick="history.back()">Cancel</button>
  </form>
{% endblock %}
